<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://lucide.dev/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prestige Car Rental</title>
    <!-- Google Fonts for Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gold: {
                400: '#eecf6d',
                500: '#d4af37', // Primary Gold
                600: '#b4941f',
              },
              black: {
                900: '#111111', // Deep Black
                800: '#1a1a1a',
                700: '#2a2a2a'
              }
            },
            fontFamily: {
              sans: ['Tajawal', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      /* Dark Mode (Default) */
      html.dark {
        background-color: #111111;
        color: #f3f4f6;
      }

      html.dark body {
        background-color: #111111;
        color: #f3f4f6;
      }

      /* Light Mode */
      html.light {
        background-color: #f9fafb;
        color: #000000;
      }

      html.light body {
        background-color: #f9fafb;
        color: #000000;
      }

      html.light .bg-black-900 {
        background-color: #f3f4f6 !important;
      }

      html.light .bg-black-800 {
        background-color: #e5e7eb !important;
      }

      html.light .bg-black-700 {
        background-color: #d1d5db !important;
      }

      html.light .text-white {
        color: #000000 !important;
      }

      html.light .text-gray-400 {
        color: #374151 !important;
      }

      html.light .text-gray-500 {
        color: #4b5563 !important;
      }

      html.light .border-white\/10 {
        border-color: rgba(0, 0, 0, 0.1) !important;
      }

      html.light .border-white\/5 {
        border-color: rgba(0, 0, 0, 0.05) !important;
      }

      html.light .bg-white\/5 {
        background-color: rgba(0, 0, 0, 0.03) !important;
      }

      /* Custom Scrollbar - Dark */
      html.dark ::-webkit-scrollbar {
        width: 8px;
      }
      html.dark ::-webkit-scrollbar-track {
        background: #111111;
      }
      html.dark ::-webkit-scrollbar-thumb {
        background: #2a2a2a;
        border-radius: 4px;
      }
      html.dark ::-webkit-scrollbar-thumb:hover {
        background: #d4af37;
      }

      /* Custom Scrollbar - Light */
      html.light ::-webkit-scrollbar {
        width: 8px;
      }
      html.light ::-webkit-scrollbar-track {
        background: #f9fafb;
      }
      html.light ::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 4px;
      }
      html.light ::-webkit-scrollbar-thumb:hover {
        background: #d4af37;
      }
      
      /* Print Styles */
      @media print {
        @page {
          size: A4;
          margin: 10mm;
        }
        
        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        
        body {
          background: white !important;
          margin: 0 !important;
          padding: 0 !important;
        }
        
        body * {
          visibility: hidden !important;
        }
        
        .no-print {
          display: none !important;
        }
        
        .print-area,
        .print-area * {
          visibility: visible !important;
        }
        
        .print-area {
          display: block !important;
          position: static !important;
          width: 100% !important;
          background: white !important;
          color: black !important;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "jspdf": "https://esm.sh/jspdf@^3.0.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
